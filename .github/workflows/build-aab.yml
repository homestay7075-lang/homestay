name: Build Android App Bundles (.AAB)

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-aab.yml'
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android Release APK and App Bundle (.aab)
      working-directory: ./android
      run: |
        chmod +x gradlew || true
        gradle wrapper
        ./gradlew assembleRelease bundleRelease --stacktrace

    - name: Copy generated APK and AAB files
      run: |
        mkdir -p release-packages
        find android/app/build/outputs -name "*.aab" -exec cp {} release-packages/ \;
        find android/app/build/outputs -name "*.apk" -exec cp {} release-packages/ \;
        ls -la release-packages

    - name: Upload APK & AAB Packages as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: homestay-android-packages
        path: release-packages/*
        retention-days: 30

name: Build Android Packages (.AAB & .APK)

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-aab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Signing Keystore
      working-directory: ./android/app
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=HomeStay, OU=Mobile, O=HomeStay, L=Mumbai, S=Maharashtra, C=IN"

    - name: Build Android Release APK and App Bundle (.aab)
      working-directory: ./android
      run: |
        chmod +x gradlew || true
        gradle wrapper
        ./gradlew assembleRelease bundleRelease --stacktrace

    - name: Copy generated APK and AAB files
      run: |
        mkdir -p release-packages
        find android/app/build/outputs -name "*.aab" -exec cp {} release-packages/ \;
        find android/app/build/outputs -name "*.apk" -exec cp {} release-packages/ \;
        ls -la release-packages

    - name: Update APK in public/downloads
      run: |
        mkdir -p public/downloads
        APK_SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -n "$APK_SRC" ] && [ -f "$APK_SRC" ]; then
          cp "$APK_SRC" public/downloads/homestay-app.apk
          cp "$APK_SRC" public/downloads/homestay-v1.0.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/homestay-app.apk public/downloads/homestay-v1.0.0.apk
          if ! git diff --cached --quiet; then
            git commit -m "build(apk): auto-update genuine release APK with production URL [skip ci]"
            git push origin main
          fi
        fi

    - name: Upload APK & AAB Packages as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: homestay-android-packages
        path: release-packages/*
        retention-days: 30
